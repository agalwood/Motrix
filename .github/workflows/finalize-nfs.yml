name: Finalize NFS

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/finalize-fs/**'
      - 'src/core/plugin/finalize/**'
      - 'src/core/session/*finalize*'
      - '.github/workflows/finalize-nfs.yml'
  push:
    branches: [main]
    paths:
      - 'packages/finalize-fs/**'
      - 'src/core/plugin/finalize/**'
      - 'src/core/session/*finalize*'
      - '.github/workflows/finalize-nfs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finalize-nfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-nfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['3', '4.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.1
          targets: x86_64-unknown-linux-musl
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
      - name: Build native sidecar
        run: cargo build --manifest-path packages/finalize-fs/Cargo.toml --locked --target x86_64-unknown-linux-musl
      - name: Exercise an actual root-squashed NFS mount
        env:
          NFS_VERSION: ${{ matrix.version }}
          MOTRIX_FINALIZE_FS_TEST_BIN: packages/finalize-fs/target/x86_64-unknown-linux-musl/debug/motrix-finalize-fs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y nfs-kernel-server nfs-common
          export_root=$(mktemp -d /tmp/motrix-nfs-export-XXXXXX)
          mount_root=$(mktemp -d /tmp/motrix-nfs-mount-XXXXXX)
          export_file=/etc/exports.d/motrix-finalize.exports
          cleanup() {
            sudo umount "$mount_root" || true
            sudo exportfs -u "127.0.0.1:$export_root" || true
            sudo rm -f "$export_file"
            sudo rm -rf "$export_root" "$mount_root"
          }
          trap cleanup EXIT
          chmod 1777 "$export_root"
          sudo mkdir -p /etc/exports.d
          printf '%s 127.0.0.1(rw,sync,no_subtree_check,root_squash,fsid=0)\n' "$export_root" | sudo tee "$export_file"
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -ra
          remote="$export_root"
          if [ "$NFS_VERSION" = '4.2' ]; then remote=/; fi
          sudo mount -t nfs -o "vers=$NFS_VERSION,proto=tcp" "127.0.0.1:$remote" "$mount_root"
          findmnt "$mount_root"
          export MOTRIX_FINALIZE_NFS_ROOT="$mount_root"
          # The test fails if the supplied path is not really an NFS mount.
          cargo test --manifest-path packages/finalize-fs/Cargo.toml --locked -- --ignored --exact platform::unix::tests::nfs_supports_link_publication_and_private_removal
          pnpm exec vitest run src/core/plugin/finalize/finalize-nfs-recovery.integration.test.ts src/core/plugin/finalize/finalize-adversarial.integration.test.ts --reporter=verbose
