# Uploads are independently resumable; only the complete verified set is released.
name: Publish Snap artifacts
on:
  workflow_call:
    inputs:
      expected_version:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact version of the original protected release tag
        required: true
        type: string
      source_run_id:
        description: Original tag-triggered Snap build run (never a recovery run)
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: snap-store-publication
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify original Snap build provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - name: Checkout trusted publication tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify original tag, successful builds, and immutable artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: python3 scripts/snap_publication.py source

  upload:
    name: Upload Snap / ${{ matrix.arch }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: snap-store-edge
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [amd64, arm64]
    env:
      MOTRIX_SNAP_ARCH: ${{ matrix.arch }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      SNAP_SOURCE: ${{ needs.preflight.outputs.source }}
    steps:
      - name: Checkout verification tools
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm for verification
        timeout-minutes: 5
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
          run_install: false

      - name: Setup Node.js for verification
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install verifier dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'

      - name: Download and authenticate original architecture artifact
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/snap_publication.py download

      - name: Verify architecture package before Store access
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools
          node scripts/verify-snap-artifact.mjs --snap "release/snap-verified/motrix_verified_${MOTRIX_SNAP_ARCH}.snap" --arch "$MOTRIX_SNAP_ARCH" --version "$EXPECTED_VERSION"

      - name: Install Snapcraft 9
        timeout-minutes: 10
        run: sudo snap install snapcraft --classic --channel=9.x/stable

      - name: Verify edge credential scope
        timeout-minutes: 5
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: python3 scripts/verify_snap_credential_scope.py --channel latest/edge --require-upload

      - name: Reconcile Store hash and upload at most once
        timeout-minutes: 15
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        # Reuse Snapcraft's own credential handling and bundled Python libraries.
        run: |
          # Expand SNAP inside snap run's shell, not the runner's shell.
          # shellcheck disable=SC2016
          snap run --shell snapcraft -c 'exec "$SNAP/bin/python" scripts/upload_snap_revision.py'

      - name: Preserve architecture receipt immediately
        if: ${{ always() && hashFiles('release/snap-upload-receipt.json') != '' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-upload-${{ github.run_id }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: release/snap-upload-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve sanitized upload diagnostics
        if: ${{ always() && hashFiles('release/snap-upload-state.json') != '' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-upload-state-${{ github.run_id }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: release/snap-upload-state.json
          retention-days: 90

  publish-edge:
    name: Release complete verified Snap build set
    needs: [preflight, upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: snap-store-edge
    env:
      SNAP_SOURCE: ${{ needs.preflight.outputs.source }}
      SNAP_REVISION_FILE: ${{ github.workspace }}/release/motrix-snap-revisions.json
    steps:
      - name: Checkout verification tools
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm for verification
        timeout-minutes: 5
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
          run_install: false

      - name: Setup Node.js for verification
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install verifier dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'

      - name: Aggregate verified architecture receipts
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/snap_publication.py aggregate

      - name: Install Snapcraft 9
        timeout-minutes: 10
        run: sudo snap install snapcraft --classic --channel=9.x/stable

      - name: Validate scoped Store credential
        id: scope
        timeout-minutes: 5
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: python3 scripts/verify_snap_credential_scope.py --channel latest/edge --github-output "$GITHUB_OUTPUT"

      - name: Reverify both Store hashes before changing edge
        timeout-minutes: 5
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          # shellcheck disable=SC2016
          snap run --shell snapcraft -c 'exec "$SNAP/bin/python" scripts/upload_snap_revision.py verify'

      # Snapcraft's "promote" command re-reads a mutable source channel and
      # releases each architecture separately. This compensating release
      # helper instead binds the captured revisions, closes the target before
      # mutation, and restores the previous mapping after a normal failure.
      - name: Release exact build set to edge
        timeout-minutes: 45
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAPCRAFT_CHANNEL: ${{ steps.scope.outputs.snapcraft_channel }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          revisions="$(
            # JavaScript source must not be expanded by Bash.
            # shellcheck disable=SC2016
            node --input-type=module -e '
              import { readFileSync } from "node:fs"
              const value = JSON.parse(readFileSync(process.argv[1], "utf8"))
              for (const arch of ["amd64", "arm64"]) {
                if (!/^[1-9]\d*$/.test(value[arch] ?? "")) {
                  throw new Error(`Invalid ${arch} revision`)
                }
              }
              process.stdout.write(`${value.amd64} ${value.arm64}`)
            ' "$SNAP_REVISION_FILE"
          )"
          read -r amd64_revision arm64_revision <<< "$revisions"
          node scripts/release-snap-build-set.mjs \
            --snap motrix \
            --channel latest/edge \
            --version "$EXPECTED_VERSION" \
            --amd64-revision "$amd64_revision" \
            --arm64-revision "$arm64_revision" \
            --snapcraft-channel "$SNAPCRAFT_CHANNEL" \
            --snapcraft /snap/bin/snapcraft \
            --snapcraft-timeout-ms 120000 \
            --attempts 12 \
            --delay-ms 10000

      - name: Verify public edge channel
        timeout-minutes: 10
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: >-
          node scripts/verify-snap-store-channel.mjs
          --snap motrix
          --channel latest/edge
          --version "$EXPECTED_VERSION"
          --architectures amd64,arm64
          --expected-revisions "$SNAP_REVISION_FILE"
          --attempts 12
          --delay-ms 10000

      # This immutable, run-associated artifact is the only trusted revision
      # provenance accepted by snap-promote.yml.
      - name: Preserve trusted revision record
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-release-revisions-${{ github.run_attempt }}
          path: |
            ${{ env.SNAP_REVISION_FILE }}
            release/snap-provenance.json
          if-no-files-found: error
          retention-days: 90
