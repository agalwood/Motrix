name: Publish

# Dispatch explicitly on an immutable v<package.version> tag after npm trusted
# publishing has been configured. Creating a tag alone never publishes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require a version tag on main
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/)
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${version}`)
          execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/main'])
          JS

  checks:
    needs: release-ref
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.sha }}
          path: output/package
      - run: npm install --global npm@11.16.0
      - name: Publish the verified artifact with provenance
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import { readdirSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const files = readdirSync('output/package').filter((file) => file.endsWith('.tgz'))
          assert.equal(files.length, 1)
          execFileSync('npm', ['publish', `output/package/${files[0]}`, '--access', 'public', '--provenance'], { stdio: 'inherit' })
          JS
