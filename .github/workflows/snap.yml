# Motrix — strict Snap build and edge publication
#
# Snap is deliberately independent from the GitHub Release workflow:
#   - amd64 and arm64 are built on matching native Ubuntu runners;
#   - pull requests and ordinary manual builds never receive Store credentials;
#   - protected stable and beta release tags publish a complete
#     two-architecture build set to latest/edge only;
#   - snap-publish.yml can recover original tag artifacts from protected main;
#   - candidate and stable receive that exact build set through snap-promote.yml.

name: Snap

on:
  workflow_call:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# The publication workflow owns the shared Store lock, including recovery.
concurrency:
  group: snap-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  preflight:
    name: Validate Snap source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release metadata
        id: metadata
        env:
          # Pull requests and manual runs validate package SemVer without
          # pretending to be a protected release-tag event.
          RELEASE_EVENT_NAME: >-
            ${{
              github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              && 'push'
              || 'workflow_dispatch'
            }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          node scripts/release-metadata.mjs
          --package-json package.json
          --github-output "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor \
            "$GITHUB_SHA" refs/remotes/origin/main

  build:
    name: Build Snap / ${{ matrix.snap_arch }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # rustc's musl std is self-contained; overriding the linker with Ubuntu's
    # musl-gcc mixes CRTs and produces binaries that SIGSEGV at load (see
    # ci.yml package-targets).
    strategy:
      fail-fast: false
      matrix:
        include:
          - snap_arch: amd64
            electron_arch: x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            app_dir: release/linux-unpacked
          - snap_arch: arm64
            electron_arch: arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            app_dir: release/linux-arm64-unpacked

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.rust_target }}

      - name: Test native host target
        run: >-
          cargo test
          --manifest-path packages/native-host/Cargo.toml
          --locked
          --target ${{ matrix.rust_target }}

      - name: Test finalize filesystem target
        run: >-
          cargo test
          --manifest-path packages/finalize-fs/Cargo.toml
          --locked
          --target ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ENGINE_FETCH: '1'

      # Electron does not declare a postinstall script, so pnpm install
      # does not hydrate dist/ with the runtime and license payload.
      - name: Ensure Electron runtime payload
        run: node scripts/ensure-electron-runtime.mjs --retry-download

      - name: Fetch target aria2
        run: >-
          pnpm run fetch:engine
          --platform linux
          --arch ${{ matrix.electron_arch }}

      - name: Third-party notice contract
        run: pnpm run check:third-party-notices

      - name: Build package inputs
        run: |
          pnpm run build:builtin
          pnpm run build:native-host -- \
            --platform linux \
            --arch ${{ matrix.electron_arch }}
          pnpm run build:finalize-fs -- \
            --platform linux \
            --arch ${{ matrix.electron_arch }}
          pnpm run build:electron

      - name: Stage Electron application
        run: >-
          pnpm run stage:electron --
          --platform linux
          --arch ${{ matrix.electron_arch }}

      - name: Build unpacked Electron application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >-
          pnpm exec electron-builder
          --linux
          --dir
          --${{ matrix.electron_arch }}
          --publish never

      - name: Verify Electron package
        run: >-
          node scripts/verify-electron-package.mjs
          --app-dir "${{ matrix.app_dir }}"
          --platform linux
          --arch ${{ matrix.electron_arch }}
          --report "release/size-reports/linux-${{ matrix.electron_arch }}.json"

      - name: Prepare isolated Snapcraft project
        run: >-
          node scripts/prepare-snap-project.mjs
          --arch ${{ matrix.snap_arch }}
          --version "${{ needs.preflight.outputs.version }}"
          --app-dir "${{ matrix.app_dir }}"
          --output-dir "release/snap-${{ matrix.snap_arch }}"

      - name: Build strict Snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          path: release/snap-${{ matrix.snap_arch }}
          build-info: true
          snapcraft-channel: 9.x/stable

      - name: Verify publication client compatibility without Store credentials
        # Exercise an ARM64 publication target even on the amd64 tooling host.
        env:
          MOTRIX_SNAP_ARCH: arm64
        run: |
          # shellcheck disable=SC2016
          snap run --shell snapcraft -c 'exec "$SNAP/bin/python" scripts/upload_snap_revision.py check-client'

      - name: Verify Snap artifact
        run: >-
          node scripts/verify-snap-artifact.mjs
          --snap "${{ steps.snapcraft.outputs.snap }}"
          --arch ${{ matrix.snap_arch }}
          --version "${{ needs.preflight.outputs.version }}"

      - name: Upload verified Snap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-input-${{ matrix.snap_arch }}
          path: |
            ${{ steps.snapcraft.outputs.snap }}
            release/size-reports/linux-${{ matrix.electron_arch }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 7 }}

  publish-edge:
    name: Publish complete build set to edge
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected == true
    needs: [preflight, build]
    uses: ./.github/workflows/snap-publish.yml
    with:
      expected_version: ${{ needs.preflight.outputs.version }}
      source_run_id: ${{ github.run_id }}
    secrets: inherit
