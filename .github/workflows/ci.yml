# Complete tests on every PR; presentation-only changes use three native
# desktop targets. Main, nightly and manual runs validate all six targets and
# both distribution formats. The stable `ci` job checks every selected result.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      package_matrix: ${{ steps.plan.outputs.package_matrix }}
      distributions: ${{ steps.plan.outputs.distributions }}
      installers: ${{ steps.plan.outputs.installers }}
      filesystems: ${{ steps.plan.outputs.filesystems }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks from the complete Git diff
        id: plan
        run: node scripts/ci-plan.mjs

  quality:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'

      # Electron has no package postinstall, so pnpm install does not
      # hydrate dist/. The notice contract needs the runtime license payload;
      # the package installer is idempotent when dist/ already matches.
      - name: Ensure Electron runtime payload
        run: node scripts/ensure-electron-runtime.mjs --retry-download

      - name: i18n catalog and translation contract
        run: pnpm run check:i18n

      - name: Schema parity check
        run: pnpm run check:schema-parity

      - name: Third-party notice contract
        # The verifier tests run once in the root test shards.
        run: node scripts/generate-third-party-notices.mjs --check

      - name: File naming conventions
        run: pnpm run check:file-names

      - name: Architecture and icon import boundaries
        run: pnpm run check:boundaries

      - name: Biome toolchain fingerprint
        run: |
          pnpm exec biome --version
          pnpm ls @biomejs/biome

      - name: Lint
        run: pnpm run lint

      - name: Type-check (root)
        run: pnpm exec tsc --noEmit

      - name: Native host JavaScript tooling tests
        run: >-
          node --test
          packages/native-host/build.test.mjs
          packages/native-host/package-flatpak-companion.test.mjs

  tests:
    name: Tests / ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
      - name: Ensure Electron runtime payload
        run: node scripts/ensure-electron-runtime.mjs --retry-download
      - name: Setup Rust for native test fixtures
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.1
      - name: Prepare native filesystem test fixture
        # These suites inspect binary availability during collection. Preparing
        # it here removes their former dependency on another test's beforeAll.
        run: |
          cargo build --manifest-path packages/finalize-fs/Cargo.toml --locked
          test -x packages/finalize-fs/target/debug/motrix-finalize-fs
      - name: Run complete test partition
        # pnpm test preserves the Node ABI pretest hook. No changed-file filter
        # or relaxed isolation: every root test belongs to exactly one shard.
        run: >-
          pnpm test --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=json
          --outputFile=output/ci/reports/shard-${{ matrix.shard }}.json
        env:
          MOTRIX_REQUIRE_ELECTRON_PROXY_TEST: '1'
      - name: Upload test partition report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-tests-${{ matrix.shard }}
          path: output/ci/reports/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  test-reports:
    name: Verify complete test coverage
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: root-tests-*
          path: output/ci/reports
          merge-multiple: true
      - name: Check every discovered test file ran exactly once
        run: |
          pnpm exec vitest list --filesOnly --json=output/ci/test-files.json
          node scripts/verify-ci-test-reports.mjs

  torrent-browser:
    name: Torrent / Chromium, Firefox, WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
      - name: Install torrent conformance browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Torrent conformance on HTTP without WebCrypto
        run: pnpm test:browser:torrent

  server-runtime:
    name: Server runtime / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-musl
            os: ubuntu-22.04
            docker_arch: amd64
          - target: linux-arm64-musl
            os: ubuntu-22.04-arm
            docker_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build staged Server image
        run: >-
          docker build
          --platform linux/${{ matrix.docker_arch }}
          --tag motrix-server-ci:${{ matrix.target }}
          .

      - name: Export Server size report
        run: >-
          docker build
          --platform linux/${{ matrix.docker_arch }}
          --target server-size-report
          --output type=local,dest=release/size-reports
          .

      - name: Smoke staged Server image
        run: >-
          node scripts/smoke-server-image.mjs
          --image motrix-server-ci:${{ matrix.target }}

      - name: Upload Server size report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-size-report-${{ matrix.target }}
          path: release/size-reports/server-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14

  rust-quality:
    name: Rust / fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Format
        run: |
          cargo fmt --manifest-path packages/native-host/Cargo.toml --all -- --check
          cargo fmt --manifest-path packages/finalize-fs/Cargo.toml --all -- --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path packages/native-host/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path packages/finalize-fs/Cargo.toml --all-targets --locked -- -D warnings

      - name: Tests
        run: |
          cargo test --manifest-path packages/native-host/Cargo.toml --locked --all-targets
          cargo test --manifest-path packages/finalize-fs/Cargo.toml --locked --all-targets

  safari-native-host:
    name: Safari native host / macOS
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Validate the macOS-only Safari FFI
        run: |
          cargo fmt --manifest-path packages/native-host/Cargo.toml --all -- --check
          cargo clippy --manifest-path packages/native-host/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path packages/native-host/Cargo.toml --all-targets --all-features --locked

  package-targets:
    needs: plan
    name: Package smoke / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # No CARGO_TARGET_*_MUSL_LINKER override: rustc's musl std is
    # self-contained (bundled musl CRT + libc.a, linked via the host cc as
    # `-static-pie`). Forcing Ubuntu's musl-gcc wrapper mixed its older musl
    # CRT into the link and emitted a dynamic-loader INTERP, so every x86_64
    # musl binary segfaulted at load (runs 31322798699 / 31324102504 /
    # 31349513764).
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'darwin' && '13.0' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.rust_target }}

      - name: Cache native compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native-host/target
            packages/finalize-fs/target
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-1.94.1-${{ hashFiles('.cargo/**', 'packages/*/Cargo.lock', 'packages/*/Cargo.toml') }}-${{ hashFiles('packages/native-host/src/**', 'packages/finalize-fs/src/**') }}
          restore-keys: |
            native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-1.94.1-${{ hashFiles('.cargo/**', 'packages/*/Cargo.lock', 'packages/*/Cargo.toml') }}-

      - name: Identify Swift toolchain
        if: matrix.platform == 'darwin'
        id: swift
        run: echo "version=$(xcrun swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Safari helper compilation
        if: matrix.platform == 'darwin'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: packages/safari-bootstrap/.build
          key: safari-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-1.94.1-${{ hashFiles('.cargo/**', 'packages/native-host/Cargo.*', 'packages/native-host/src/**', 'packages/native-host/include/**', 'packages/safari-bootstrap/Package.swift', 'packages/safari-bootstrap/Package.resolved', 'packages/safari-bootstrap/Sources/**', 'packages/safari-bootstrap/Tests/**', 'packages/safari-bootstrap/Native/**', 'packages/safari-bootstrap/Executables/**', 'packages/safari-bootstrap/configuration.json', 'packages/safari-bootstrap/build.mjs') }}
          restore-keys: |
            safari-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-1.94.1-

      # Every matrix entry uses a runner with the same native architecture as
      # rust_target. Tests therefore execute the target binary directly; no
      # Rosetta, QEMU, Wine, or compile-only result is presented as a test.
      - name: Tests (native target)
        env:
          RUST_BACKTRACE: full
        run: >-
          cargo test
          --manifest-path packages/native-host/Cargo.toml
          --locked
          --all-targets
          --target ${{ matrix.rust_target }}

      - name: Tests (finalize filesystem target)
        env:
          RUST_BACKTRACE: full
        run: >-
          cargo test
          --manifest-path packages/finalize-fs/Cargo.toml
          --locked
          --all-targets
          --target ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'

      # Electron does not hydrate dist/ during pnpm install. build:legal
      # and the electron-builder smoke both require that runtime payload.
      - name: Ensure Electron runtime payload
        run: node scripts/ensure-electron-runtime.mjs --retry-download

      - name: Fetch target aria2
        env:
          MOTRIX_ENGINE_FETCH_TIMEOUT_MS: '90000'
        run: >-
          pnpm run fetch:engine
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - name: Build package inputs
        run: |
          pnpm run build:builtin
          pnpm run build:native-host -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          pnpm run build:finalize-fs -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Native runtime integration
        env:
          MOTRIX_ARIA2_TEST_BIN: ${{ github.workspace }}/extra/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.platform == 'win32' && 'aria2c.exe' || 'aria2c' }}
          MOTRIX_REQUIRE_HTTP_RETRY_TEST: '1'
          MOTRIX_LEGACY_CHECKPOINT_ENGINE: ${{ github.workspace }}/extra/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.platform == 'win32' && 'aria2c.exe' || 'aria2c' }}
          MOTRIX_FINALIZE_FS_TEST_BIN: packages/finalize-fs/dist/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.platform == 'win32' && 'motrix-finalize-fs.exe' || 'motrix-finalize-fs' }}
        run: >-
          pnpm exec vitest run
          src/core/task/direct-task-retry.integration.test.ts
          src/core/task/http-finalize.integration.test.ts
          src/core/engine/aria2/aria2-session-identity-recovery.integration.test.ts
          src/core/engine/aria2/aria2-parent-lifecycle.integration.test.ts
          src/core/legacy-import/http-activation.integration.test.ts
          src/core/plugin/finalize/native-artifact-operations.integration.test.ts
          src/core/plugin/finalize/finalize-adversarial.integration.test.ts
          src/core/plugin/finalize/finalize-smb-recovery.integration.test.ts
          src/core/plugin/finalize/finalize-nfs-recovery.integration.test.ts
          --reporter=verbose

      - name: Test and build Safari desktop helpers
        if: matrix.platform == 'darwin'
        run: |
          pnpm exec vitest run tests/scripts/safari-desktop-package.test.ts
          swift test --package-path packages/safari-bootstrap
          pnpm run build:safari-bootstrap -- --arch ${{ matrix.arch }} --test

      # SQLite integration tests above use Node. Switch native modules to the
      # packaged Electron ABI only after those tests have finished.
      - name: Build Electron application
        run: pnpm run build:electron

      - name: Stage Electron application
        run: >-
          pnpm run stage:electron --
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - name: Package Flatpak native host companion smoke
        if: matrix.platform == 'linux'
        shell: bash
        env:
          COMPANION_ARCH: ${{ matrix.arch }}
          COMPANION_OUTPUT: ${{ runner.temp }}/flatpak-companion
          SOURCE_DATE_EPOCH: '0'
        run: |
          set -euo pipefail
          pnpm run package:flatpak-native-host -- \
            --version 0.0.0-ci \
            --arch "$COMPANION_ARCH" \
            --output-dir "$COMPANION_OUTPUT"
          archive="${COMPANION_OUTPUT}/Motrix-Native-Host-0.0.0-ci-linux-${COMPANION_ARCH}.tar.gz"
          test -f "$archive"
          tar -tzf "$archive" > /dev/null

      # `--dir` runs electron-builder's full beforePack/resource copy path
      # without spending CI time producing installers already covered by the
      # release workflow.
      - name: Electron Builder package smoke
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >-
          pnpm exec electron-builder
          ${{ matrix.electron_builder_args }}
          --dir
          --publish never

      # Explicit archive targets override --dir in electron-builder. Keep them
      # out of ordinary smoke builds; full validation also exercises installers.
      - name: Build Windows installers
        if: matrix.platform == 'win32' && needs.plan.outputs.installers == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >-
          pnpm exec electron-builder --win nsis zip --${{ matrix.arch }}
          --prepackaged "${{ matrix.app_path }}" --publish never

      - name: Install Arch packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd libarchive-tools

      - name: Build Arch package smoke
        if: matrix.platform == 'linux'
        run: >-
          pnpm exec electron-builder
          --linux pacman --${{ matrix.arch }}
          --prepackaged "${{ matrix.app_path }}"
          --publish never

      - name: Verify Electron package
        run: >-
          node scripts/verify-electron-package.mjs
          --app-dir "${{ matrix.app_path }}"
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --report "release/size-reports/${{ matrix.target }}.json"

      - name: Verify Arch Linux package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/verify-pacman-artifact.mjs \
            --dir release --version "$version" --arch ${{ matrix.arch }}

      - name: Smoke test Arch Linux installation
        if: matrix.target == 'linux-x64'
        run: bash scripts/smoke-pacman-package.sh release

      - name: Verify Windows native host runtime imports
        if: matrix.platform == 'win32'
        shell: pwsh
        run: >-
          ./scripts/verify-windows-native-host-dependencies.ps1
          -Binary
          "${{ matrix.resources_dir }}/bin/motrix-native-host.exe"

      - name: Verify packaged resources
        shell: node {0}
        env:
          PACKAGED_RESOURCES: ${{ matrix.resources_dir }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          const fs = require('node:fs')
          const path = require('node:path')
          const host =
            process.env.TARGET_PLATFORM === 'win32'
              ? 'motrix-native-host.exe'
              : 'motrix-native-host'
          const engine =
            process.env.TARGET_PLATFORM === 'win32' ? 'aria2c.exe' : 'aria2c'
          const finalize =
            process.env.TARGET_PLATFORM === 'win32'
              ? 'motrix-finalize-fs.exe'
              : 'motrix-finalize-fs'
          const resources = process.env.PACKAGED_RESOURCES
          const required = [
            'app.asar',
            'THIRD_PARTY_NOTICES.md',
            'THIRD_PARTY_NOTICES.zh-CN.md',
            path.join('THIRD_PARTY_LICENSES', 'aria2-COPYING'),
            path.join('legal', 'THIRD_PARTY_DEPENDENCIES.md'),
            path.join('legal', 'THIRD_PARTY_LICENSES.txt'),
            path.join('legal', 'sbom.spdx.json'),
            path.join('bin', host),
            path.join('bin', finalize),
            path.join(
              'extra',
              process.env.TARGET_PLATFORM,
              process.env.TARGET_ARCH,
              engine
            ),
          ]
          for (const relative of required) {
            const file = path.join(resources, relative)
            const info = fs.statSync(file)
            if (!info.isFile()) throw new Error(`not a file: ${file}`)
            if (
              process.env.TARGET_PLATFORM !== 'win32' &&
              relative !== 'app.asar' &&
              !relative.startsWith('THIRD_PARTY_') &&
              !relative.startsWith(`legal${path.sep}`)
            ) {
              fs.accessSync(file, fs.constants.X_OK)
            }
          }
          const forbidden = [
            'motrix-flatpak-native-host',
            'motrix-flatpak-native-host.exe',
            'motrix-native-host-broker',
            'motrix-native-host-broker.exe',
          ]
          for (const name of forbidden) {
            const file = path.join(resources, 'bin', name)
            if (fs.existsSync(file)) {
              throw new Error(`Flatpak-only native host leaked into package: ${file}`)
            }
          }

      - name: Smoke test native Windows Electron runtime
        if: matrix.platform == 'win32'
        run: >-
          pnpm run smoke:electron-package --
          --app-dir "${{ matrix.app_path }}"
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --report "release/size-reports/${{ matrix.target }}-runtime.json"

      - name: Verify staged Windows aria2 WebSocket contract
        if: matrix.platform == 'win32'
        env:
          MOTRIX_ARIA2_TEST_BIN: ${{ matrix.resources_dir }}/extra/win32/${{ matrix.arch }}/aria2c.exe
        run: >-
          pnpm exec vitest run
          src/core/engine/aria2/engine-websocket-contract.integration.test.ts
          src/core/bridge-receiver/task-cookies.integration.test.ts
          --reporter=verbose

      - name: Upload Electron size report
        if: ${{ !cancelled() && hashFiles('release/size-reports/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-size-report-${{ matrix.target }}-${{ github.run_attempt }}
          path: release/size-reports/${{ matrix.target }}*.json
          if-no-files-found: error
          retention-days: 14

  flatpak:
    needs: plan
    if: needs.plan.outputs.distributions == 'true'
    uses: ./.github/workflows/flatpak.yml

  snap:
    permissions:
      contents: read
      actions: read
    needs: plan
    if: needs.plan.outputs.distributions == 'true'
    uses: ./.github/workflows/snap.yml

  finalize-filesystems:
    needs: plan
    if: needs.plan.outputs.filesystems == 'true'
    uses: ./.github/workflows/finalize-filesystems.yml

  finalize-nfs:
    needs: plan
    if: needs.plan.outputs.filesystems == 'true'
    uses: ./.github/workflows/finalize-nfs.yml

  finalize-smb:
    needs: plan
    if: needs.plan.outputs.filesystems == 'true'
    uses: ./.github/workflows/finalize-smb.yml

  finalize-exfat:
    needs: plan
    if: needs.plan.outputs.filesystems == 'true'
    uses: ./.github/workflows/finalize-exfat.yml

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - plan
      - quality
      - tests
      - test-reports
      - torrent-browser
      - server-runtime
      - rust-quality
      - safari-native-host
      - package-targets
      - flatpak
      - snap
      - finalize-filesystems
      - finalize-nfs
      - finalize-smb
      - finalize-exfat
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require success from every selected check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
