name: Finalize Linux filesystems

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/finalize-fs/**'
      - 'src/core/plugin/finalize/**'
      - 'src/core/session/*finalize*'
      - '.github/scripts/finalize-filesystems.sh'
      - '.github/workflows/finalize-filesystems.yml'
  push:
    branches: [main]
    paths:
      - 'packages/finalize-fs/**'
      - 'src/core/plugin/finalize/**'
      - 'src/core/session/*finalize*'
      - '.github/scripts/finalize-filesystems.sh'
      - '.github/workflows/finalize-filesystems.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finalize-filesystems-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        filesystem: [ext4, btrfs, xfs, f2fs, exfat, vfat, ntfs3, ntfs-3g, tmpfs, overlay]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.1
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs btrfs-progs xfsprogs f2fs-tools exfatprogs dosfstools ntfs-3g
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
      - name: Build native sidecar
        run: cargo build --manifest-path packages/finalize-fs/Cargo.toml --locked
      - name: Test publication and recovery on a disposable volume
        env:
          MATRIX_FILESYSTEM: ${{ matrix.filesystem }}
        run: bash .github/scripts/finalize-filesystems.sh "$MATRIX_FILESYSTEM"
