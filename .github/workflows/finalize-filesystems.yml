name: Finalize Linux filesystems

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/finalize-fs/**'
      - 'src/core/plugin/finalize/**'
      - 'src/core/session/*finalize*'
      - '.github/scripts/finalize-filesystems.sh'
      - '.github/workflows/finalize-filesystems.yml'
  push:
    branches: [main]
    paths:
      - 'packages/finalize-fs/**'
      - 'src/core/plugin/finalize/**'
      - 'src/core/session/*finalize*'
      - '.github/scripts/finalize-filesystems.sh'
      - '.github/workflows/finalize-filesystems.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finalize-filesystems-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        filesystem: [ext4, btrfs, xfs, f2fs, exfat, vfat, ntfs3, ntfs-3g, tmpfs, overlay]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.1
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs btrfs-progs xfsprogs f2fs-tools exfatprogs dosfstools ntfs-3g
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
      - name: Install and load optional filesystem drivers
        if: contains(fromJSON('["f2fs", "exfat", "ntfs3"]'), matrix.filesystem)
        env:
          MATRIX_FILESYSTEM: ${{ matrix.filesystem }}
        run: |
          # Formatting tools do not provide the Azure runner's kernel drivers.
          # Match the running kernel rather than installing a newer meta-package.
          sudo apt-get install --yes --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe "$MATRIX_FILESYSTEM"
      - name: Build native sidecar
        run: cargo build --manifest-path packages/finalize-fs/Cargo.toml --locked
      - name: Test publication and recovery on a disposable volume
        env:
          MATRIX_FILESYSTEM: ${{ matrix.filesystem }}
        run: bash .github/scripts/finalize-filesystems.sh "$MATRIX_FILESYSTEM"
