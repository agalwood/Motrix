name: NAT Integration Tests

# Security note: this workflow does not consume any GitHub event payload
# (issue titles, PR bodies, commit messages) in run: steps, so there is
# no injection surface. All inputs are static config.

on:
  push:
    branches: [main, 'feature/nat_**']
    paths:
      - 'src/core/nat/**'
      - 'tests/docker/**'
      - 'tests/integration/**'
      - 'scripts/fuzz-nat-codecs.mjs'
      - '.github/workflows/nat-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/core/nat/**'
      - 'tests/docker/**'
      - 'tests/integration/**'
      - 'scripts/fuzz-nat-codecs.mjs'
      - '.github/workflows/nat-integration.yml'

jobs:
  nat-docker-matrix:
    runs-on: ubuntu-latest
    # Observed ~2 min end-to-end (image build + compose up + 5 tests);
    # 10 minutes flags a hang quickly instead of idling out a runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docker matrix
        working-directory: tests/docker
        run: make build

      - name: Run NAT integration tests
        run: pnpm exec vitest run tests/integration/nat-docker.test.ts
        env:
          CI: 'true'
          NAT_DOCKER_MATRIX: '1'

      # Fallback only: the harness dumps ps/logs itself before its afterAll
      # teardown removes the containers (this step runs after that teardown,
      # so it usually sees an empty project).
      - name: Compose state and logs on failure
        if: failure()
        working-directory: tests/docker
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Tear down
        if: always()
        working-directory: tests/docker
        run: make down

  nat-fuzz-regression:
    runs-on: ubuntu-latest
    # Worst case observed: ~1 min setup + the 5-minute main-branch fuzz
    # budget. Anything past 10 minutes is a hang, not a slow run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PRs get a 60s smoke (per-codec throughput is ~10^4..10^6 iters/sec,
      # so every codec still sees millions of inputs); each main push keeps
      # the full 5-minute budget.
      - name: Codec fuzz
        run: >-
          pnpm exec node --import tsx scripts/fuzz-nat-codecs.mjs
          --duration=${{ github.event_name == 'pull_request' && '60' || '300' }}
