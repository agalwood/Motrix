name: Publish fnOS FPK

on:
  workflow_run:
    workflows: ['Build/Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag whose exact source will be packaged
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fnos-publication
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    name: Verify stable release provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.source.outputs.publish }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_run_id: ${{ steps.source.outputs.release_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact tag, ancestry and completed formal release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fnos_publication.py preflight

  build:
    name: Build verified FPK / ${{ matrix.arch }}
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout the immutable released application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.rust_target }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
      - name: Build and verify native package and lifecycle
        env:
          MOTRIX_FNOS_BUILD: '1'
        run: |
          pnpm run fetch:engine -- --platform linux --arch '${{ matrix.arch }}'
          pnpm run build:server
          pnpm run check:third-party-notices
          pnpm run stage:server -- --platform linux --arch '${{ matrix.arch }}' --libc gnu --strict
          pnpm run build:fnos -- --arch '${{ matrix.arch }}'
      - name: Upload only verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fnos-release-${{ matrix.arch }}
          path: |
            release/fnos/Motrix-${{ needs.preflight.outputs.version }}-fnos-${{ matrix.arch }}.fpk
            release/fnos/Motrix-${{ needs.preflight.outputs.version }}-fnos-${{ matrix.arch }}.fpk.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    name: Publish complete verified FPK set
    needs: [preflight, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted publication tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fnos-release-x64
          path: release/fnos-publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fnos-release-arm64
          path: release/fnos-publish
      - name: Revalidate provenance and publish without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_RUN_ID: ${{ needs.preflight.outputs.release_run_id }}
        run: >-
          python3 scripts/fnos_publication.py publish
          release/fnos-publish "$RELEASE_TAG" "$SOURCE_SHA" "$RELEASE_RUN_ID"
