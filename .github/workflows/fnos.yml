name: fnOS native FPK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/fnos/**'
      - 'packaging/fnos-lifecycle.Dockerfile'
      - 'scripts/*fnos*'
      - 'src/server/platform/fnos/**'
      - 'src/server/http/fnos-auth*'
      - 'src/renderer/platform/fnos*'
      - '.github/workflows/fnos.yml'
      - '.github/workflows/fnos-publish.yml'
      - 'scripts/fnos_publication.py'
      - 'scripts/nas_release.py'

permissions:
  contents: read

concurrency:
  group: fnos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native FPK / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.rust_target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
      - name: Build and verify native package
        env:
          MOTRIX_FNOS_BUILD: '1'
        run: |
          pnpm run fetch:engine -- --platform linux --arch '${{ matrix.arch }}'
          pnpm run build:server
          pnpm run check:third-party-notices
          pnpm run stage:server -- --platform linux --arch '${{ matrix.arch }}' --libc gnu --strict
          pnpm run build:fnos -- --arch '${{ matrix.arch }}'
      - name: Upload verified test packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motrix-fnos-${{ matrix.arch }}
          path: |
            release/fnos/*.fpk
            release/fnos/*.sha256
            release/size-reports/server-linux-${{ matrix.arch }}-gnu.json
          if-no-files-found: error
          retention-days: 14
