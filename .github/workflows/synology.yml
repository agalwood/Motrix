name: DSM native SPK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit of a verified stable release
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'packaging/synology/**'
      - 'packaging/synology-abi.Dockerfile'
      - 'scripts/*synology*'
      - 'scripts/nas_release.py'
      - 'scripts/*server-app.mjs'
      - 'scripts/*server-package*'
      - 'scripts/server-runtime-dependencies.json'
      - 'scripts/fnos-runtime.lock.json'
      - 'scripts/engine.lock.json'
      - 'scripts/prepare-fnos-project.mjs'
      - 'packages/finalize-fs/**'
      - 'src/renderer/routes/dashboard/**'
      - 'tests/scripts/*synology*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/synology-publish.yml'
      - 'scripts/spk_archive.py'
      - 'src/server/**'
      - 'src/core/task/**'
      - '.github/workflows/synology.yml'

permissions:
  contents: read

concurrency:
  group: synology-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Native SPK / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.rust_target }}
      - name: Install ARM instruction-set verifier
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
      - name: Test SPK publication verifier
        if: matrix.arch == 'x64'
        run: python3 -B -m unittest discover -s tests/scripts -p test_synology_publication.py
      - name: Build and verify native package
        run: |
          pnpm run fetch:engine -- --platform linux --arch '${{ matrix.arch }}'
          pnpm run build:server
          pnpm run check:third-party-notices
          pnpm run stage:server -- --platform linux --arch '${{ matrix.arch }}' --libc gnu --strict
          pnpm run build:synology -- --arch '${{ matrix.arch }}' --output-dir release/synology/project
      - name: Upload verified packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motrix-synology-${{ matrix.arch }}
          path: |
            release/synology/*.spk
            release/synology/*.sha256
            release/synology/*.abi.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
