name: "🐛 Bug Report (English)"
description: Report a reproducible problem in Motrix
title: "[Bug]: "
labels:
  - "bug 🐞"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Motrix. Complete the form below so the problem can be reproduced and triaged efficiently.

        Do not include passwords, tokens, cookies, private download URLs, or other sensitive information. Redact them from logs and screenshots before submitting.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      description: Please confirm each item before submitting this report.
      options:
        - label: I searched the [open and closed issues](https://github.com/agalwood/Motrix/issues?q=is%3Aissue) and did not find an existing report for this problem.
          required: true
        - label: I reviewed the [FAQ](https://motrix.app/manual/faq/) and [Troubleshooting](https://motrix.app/manual/troubleshooting/) guides, but they did not resolve my issue.
          required: true
        - label: I tested a current Motrix Turbo v2 release, or explained below why I could not.
          required: true
        - label: I have removed sensitive information from the report, logs, and screenshots.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/agalwood/Motrix/blob/main/CODE_OF_CONDUCT.md).
          required: true

  - type: input
    id: version
    attributes:
      label: Motrix version
      description: Find the desktop version in Settings → About. For Server, provide the exact image tag or package version.
      placeholder: "2.0.0-beta.19"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Where does the problem occur?
      multiple: true
      options:
        - Desktop app
        - Headless Server (Docker)
        - Headless Server (Node.js)
        - Server Web UI
        - Browser extension / CLI / MDXP integration
        - Plugin system
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select every area that applies.
      multiple: true
      options:
        - App startup, window, tray, or notifications
        - Dashboard or task list
        - HTTP / FTP download
        - BitTorrent / magnet download
        - Settings, persistence, or migration
        - Speed limits, trackers, or port mapping
        - Plugins or marketplace
        - Browser handoff, CLI, or MDXP pairing
        - Server, Web UI, or Docker deployment
        - Installation, update, or OS integration
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      description: Include the exact OS version, architecture, and Linux desktop/session or container host details when relevant.
      placeholder: "macOS 15.6 arm64; Windows 11 24H2 x64; Ubuntu 24.04 x64 (Wayland); Synology DSM 7.2 arm64"
    validations:
      required: true

  - type: input
    id: installation
    attributes:
      label: Installation source or package
      description: Tell us how Motrix was installed or started.
      placeholder: "GitHub release .dmg, Windows installer, AppImage, Docker Hub image, pnpm start, etc."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Briefly describe the visible symptom and its impact. Focus on what happened rather than a suspected implementation cause.
      placeholder: "After I ..., Motrix ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem. Use a public or redacted test URL when a download is required.
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Start ...
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Motrix to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What did Motrix do instead? Include exact error text when available.
    validations:
      required: true

  - type: input
    id: last-working-version
    attributes:
      label: Last known working version
      description: If this is a regression, provide the most recent version that did not have the problem.
      placeholder: "2.0.0-beta.18 or Not known"

  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: Paste the relevant excerpt or attach log/diagnostic files. Remove tokens, cookies, private URLs, personal paths, and other sensitive data first.
      placeholder: "Relevant timestamped logs, crash output, or Server diagnostics"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, screen recordings, sample files, related issues, or other details that may help investigation.
