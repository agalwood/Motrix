# NAT integration test matrix.
# On Linux CI this runs with network_mode: host (required for SSDP multicast).
# On macOS/Windows, SSDP tests use direct unicast to the exposed TCP ports.

name: motrix-nat-test

services:
  upnp-v1:
    image: motrix-test/upnp-v1:latest
    cap_add: [NET_ADMIN]
    network_mode: host
    restart: unless-stopped

  upnp-v2:
    image: motrix-test/upnp-v2:latest
    cap_add: [NET_ADMIN]
    network_mode: host
    restart: unless-stopped

  natpmp:
    image: motrix-test/natpmp:latest
    cap_add: [NET_ADMIN]
    network_mode: host
    restart: unless-stopped

  # Bridge network on purpose: in its own namespace the fake server owns the
  # standard PCP port 5351 (no clash with natpmp's host-mode miniupnpd), and
  # tests reach it via its RFC1918 bridge address — the loopback route is
  # rejected by the NAT clients' SSRF guards.
  pcp-fake:
    image: motrix-test/pcp-fake:latest
    restart: unless-stopped

  hostile:
    image: motrix-test/hostile:latest
    ports:
      - "49154:49154/tcp"
    restart: unless-stopped

  broken:
    image: motrix-test/broken:latest
    ports:
      - "49155:49155/tcp"
      - "5353:5353/udp"
    restart: unless-stopped
