location = /motrix { return 302 /motrix/; }
location ^~ /motrix/bridge/ {
    proxy_pass http://unix:/var/packages/Motrix/var/client.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    # Allow the full MBP1 code-entry and credential-exchange deadlines.
    proxy_read_timeout 210s;
    client_max_body_size 1m;
    proxy_buffering off;
}
location ^~ /motrix/client/ {
    proxy_pass http://unix:/var/packages/Motrix/var/client.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_read_timeout 75s;
    client_max_body_size 4m;
    proxy_buffering off;
}
location ^~ /motrix/ {
    proxy_pass http://unix:/var/packages/Motrix/var/web.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Motrix-Dsm-Remote-Addr $remote_addr;
    proxy_set_header X-Motrix-Dsm-Server-Addr $server_addr;
    proxy_set_header X-Motrix-Dsm-Server-Port $server_port;
    proxy_set_header X-Motrix-Dsm-Scheme $scheme;
    proxy_read_timeout 75s;
    client_max_body_size 64m;
    proxy_buffering off;
}
