###############################################################################
# Motrix — aria2 base configuration
#
# This file is a TEMPLATE. On first launch, Motrix copies it to the
# user config directory; subsequent launches read the user copy. Advanced
# users may edit the user copy — values here are overridden at runtime by
# command-line flags from EngineSettings (see Aria2ConfigBuilder.ts).
#
# Reference: https://aria2.github.io/manual/en/html/aria2c.html
###############################################################################


############### File system / Disk ###########################################

# auto-save-interval is selected at runtime: Motrix injects 10 seconds when
# SQLite persistence is inactive, regardless of whether a text session is
# loaded. In SQLite mode Motrix keeps aria2's 60-second default; progress is
# saved to the database/WAL without adopting the text fallback's write cadence.

# Skip preallocation entirely for files smaller than this. Avoids wasting
# time on tiny files where allocation overhead dominates.
no-file-allocation-limit=64M


############### HTTP / FTP reliability #######################################

# Treat repeated 404s as fatal. aria2 default = 0 (disabled). 10 prevents
# infinite retry on a permanently-gone URL while tolerating brief outages.
max-file-not-found=10

# HTTP/1.1 persistent connections. aria2 default = true; explicit for clarity.
enable-http-keep-alive=true

# HTTP/1.1 pipelining. aria2 default = false. Many CDNs handle pipelining
# poorly; leave off.
enable-http-pipelining=false

# Send Accept-Encoding: gzip,deflate. Reduces bandwidth on text servers.
http-accept-gzip=true

# Decode RFC 5987 / RFC 6266 Content-Disposition filenames as UTF-8 by
# default. Critical for non-ASCII filenames from servers that don't set
# charset='UTF-8' explicitly.
content-disposition-default-utf8=true

# Keep the local completion time as the file mtime by default. The Downloads
# settings can opt in to applying the remote Last-Modified timestamp instead.
remote-time=false

# Verify TLS certificates strictly. motrix-turbo is a desktop tool, not a
# server; users wanting a self-signed mirror can disable per-task in UI
# (when surfaced).
check-certificate=true

# Allow per-URI piece length to differ from the session-saved value. Helps
# resume across CDN switches that report different chunking.
allow-piece-length-change=true


############### BitTorrent — peer behavior ###################################

# When a download finishes and starts seeding, stop counting it toward the
# concurrent-downloads quota. Otherwise long-tail seeds permanently block
# new downloads. Highly recommended for desktop UX.
bt-detach-seed-only=true

# After --check-integrity passes on a complete torrent, continue seeding
# rather than re-verifying.
bt-hash-check-seed=true

# Tracker connect/read timeouts (seconds). aria2 defaults are 60/60 — too
# long when scanning a 50-tracker list; 10 keeps the swarm fresh.
bt-tracker-connect-timeout=10
bt-tracker-timeout=10

# Stop a torrent if 0 B/s for N seconds. 0 = disabled. Disabled by default
# — users on intermittent connections would be frustrated by auto-stops.
bt-stop-timeout=0

# Peer Exchange (PEX). Default true. Trackerless swarms depend on this.
enable-peer-exchange=true


############### BitTorrent — identity ########################################

# peer-id-prefix and peer-agent MUST stay in lockstep. Mimicking
# Transmission improves connectivity on private trackers that whitelist
# clients. Smart trackers ban inconsistent pairs as spoofing.
peer-id-prefix=-TR3000-
peer-agent=Transmission/3.00


############### BitTorrent — DHT bootstrap ###################################

# Public DHT bootstrap nodes (Transmission's, well-maintained).
dht-entry-point=dht.transmissionbt.com:6881
dht-entry-point6=dht.transmissionbt.com:6881


############### Logging ######################################################

# Output download progress every N seconds to stderr. 0 = silent. We use
# RPC notifications for UI updates, so stderr noise has no value.
summary-interval=0

# Console verbosity. Pipe aria2 stderr to a log file at NOTICE level —
# INFO is too chatty for production (per-peer events).
console-log-level=notice
