[package]
name = "motrix-native-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "motrix-native-host"

[[bin]]
name = "motrix-native-host"
path = "src/main.rs"

[[bin]]
name = "motrix-native-host-broker"
path = "src/bin/motrix-native-host-broker.rs"

[[bin]]
name = "motrix-flatpak-native-host"
path = "src/bin/motrix-flatpak-native-host.rs"

[dependencies]
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
home = "0.5"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# Windows-only, and already in the dependency graph: `home` pulls the same
# windows-sys 0.61.2, so enabling these namespaces adds no new crate. Feature
# gating keeps the compiled surface to the DACL/token calls `endpoint.rs` needs
# out of the 239 namespaces this crate can expose.
[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]
