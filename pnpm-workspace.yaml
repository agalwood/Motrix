packages:
  - '.'
  - 'packages/*'

# pnpm 11 reads project settings from this file, not .npmrc — node-linker
# moved here. The hoisted (flat) node_modules layout is required by
# electron-builder and native-module rebuild tooling (see
# .claude/rules/electron-vite.md).
nodeLinker: hoisted

# pnpm 11 build-script gate (replaces onlyBuiltDependencies /
# ignoredBuiltDependencies — packages not listed have their scripts skipped):
#   - electron: retained for compatibility with releases that expose an
#     install script. Electron 43 only exposes install.js as a package bin, so
#     local consumers must use ensure:electron-runtime to validate and hydrate
#     dist/ before reading runtime files.
#   - better-sqlite3: native module rebuilt against the pinned ABI.
#   - electron-winstaller / esbuild: harmless arch-selection scripts, allowed
#     to keep installs warning-free (esbuild binaries ship via @esbuild/*
#     optional deps either way).
allowBuilds:
  electron: true
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true

