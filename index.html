<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <style id="motrix-theme-bootstrap">
      html,
      body {
        background: transparent;
        color: #18181b;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          color: #fafafa;
          color-scheme: dark;
        }
      }
    </style>
    <style>
      #renderer-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        pointer-events: none;
      }

      #renderer-boot::before {
        content: "";
        width: 62px;
        height: 14px;
        background: currentColor;
        opacity: 0.7;
        mask: url("./mo-logo.svg") center / contain no-repeat;
        -webkit-mask: url("./mo-logo.svg") center / contain no-repeat;
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Motrix</title>
  </head>
  <body>
    <div id="renderer-boot" role="progressbar" aria-label="Motrix"></div>
    <div id="root"></div>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
