name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: extension-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Extension static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24.18.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: node --test scripts/__tests__/*.test.mjs
      - run: python3 -I scripts/__tests__/safari_release_test.py
      - run: pnpm run build:chromium
      - run: pnpm run build:firefox
      - run: pnpm run build:safari
      - run: pnpm run build:webstore

  firefox-takeover:
    name: Firefox takeover (${{ matrix.firefox }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        firefox: ['143.0', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24.18.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        id: firefox
        with:
          firefox-version: ${{ matrix.firefox }}
      - name: Exercise real Firefox APIs over simulated MDXP
        run: node scripts/verify-firefox-takeover.mjs
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          EXPECTED_FIREFOX_VERSION: ${{ matrix.firefox }}
      - name: Verify complete browser evidence
        run: node scripts/verify-takeover-report.mjs .cache/firefox-takeover-report/report.json
        env:
          EXPECTED_FIREFOX_VERSION: ${{ matrix.firefox }}
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-takeover-${{ matrix.firefox }}-${{ github.run_attempt }}
          path: .cache/firefox-takeover-report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  acceptance:
    # Preserve the required status context while including browser regressions.
    name: Extension checks
    if: always()
    needs: [check, firefox-takeover]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all acceptance dependencies to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          FIREFOX_RESULT: ${{ needs.firefox-takeover.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$FIREFOX_RESULT" = success

  safari-native-core:
    name: Safari native protocol and IPC
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test --package-path native/safari --scratch-path .cache/safari-native-tests

  safari-unsigned-archive:
    name: Safari clean unsigned archive
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MOTRIX_SAFARI_RELEASE: '1'
      MOTRIX_SAFARI_TEAM_ID: 7VMB56CA56
      MOTRIX_SAFARI_BUILD_NUMBER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24.18.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Select runner Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
      - run: pnpm run build:safari
      - run: node scripts/safari-native.mjs --build --archive --unsigned-archive --bootstrap-client-only
      - name: Verify actual signing input without credentials
        run: |
          set -euo pipefail
          version="$(/usr/bin/plutil -extract version raw package.json)"
          app='.cache/safari-ci/archives/Motrix Extension for Safari-1.xcarchive/Products/Applications/Motrix Extension for Safari.app'
          digest="$(python3 -I scripts/safari-release.py pack --input "$app" --output "$RUNNER_TEMP/safari-unsigned.zip" --commit "$GITHUB_SHA" --version "$version" --build 1 --team "$MOTRIX_SAFARI_TEAM_ID")"
          python3 -I scripts/safari-release.py verify --input "$RUNNER_TEMP/safari-unsigned.zip" --digest "$digest" --commit "$GITHUB_SHA" --version "$version" --build 1 --team "$MOTRIX_SAFARI_TEAM_ID" --native
